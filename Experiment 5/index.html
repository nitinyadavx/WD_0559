<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Registration Form</title>
</head>
<body>
    <h1 align ="center">Student Registration Form</h1>
    <hr>

    <!--Registration Form-->
    <form method="post" action="submit.html"


    <!--Full Name-->
    <label for="fullName">Full Name:</label>
    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
    <br><br>

    <!--Email-->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>
    <br><br>

    <!--Password-->
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required>
    <br><br>

    <!--Gender-->
    <label for="gender">Gender:</label>
    <input type="radio" id="male" value="male" required> Male
    <input type="radio" id="female" value="female" required> Female
    <input type="radio" id="other" value="other" required> Other
    <br><br>

    <!--Course Selection-->
    <label>Course:</label>
    <select name="course" required>
        <option value="">--Select Course--</option>
        <option value="btech">B.Tech</option>
        <option value="bca">B.CA</option>
        <option value="mba">MBA</option>
        <option value="mca">MCA</option>
    </select>
    <br><br>

    <!--Phone Number-->
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
    <br><br>

    <!--Address-->
    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="40"placeholder="Enter your address" required></textarea>
    <br><br>

    <!--Submit Button-->
    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    </form>
    <hr>
    <p align="center">&copy; 2026 Student Registration Form.</p>

</body>
</html>
